[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
description = "3D Tiles schema -> Rust code generator"
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
schemagen = { git = "https://github.com/calebbuffa/schemagen.git" }
proc-macro2 = "1"
quote = "1"
clap = { version = "4", features = ["derive"] }
