[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
description = "3D Tiles schema -> Rust code generator"
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = "1"
schemagen = { path = "../../schemagen" }
prettyplease = "0.2"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
heck = "0.5"
clap = { version = "4", features = ["derive"] }
