[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "3D Tiles schema -> Rust code generator"
repository.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
heck = "0.5"
clap = { version = "4", features = ["derive"] }
