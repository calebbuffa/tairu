[package]
name = "tairu"
description = "3D Tiles 1.0/1.1 data model, reader, and writer"
edition = "2024"
version = "0.1.0"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/calebbuffa/tairu"
readme = "README.md"
keywords = ["3d-tiles", "gltf", "tileset", "spatial", "geospatial"]
categories = ["data-structures", "graphics", "science::geo"]
# `.gitmodules` and `scripts/generate.ps1` only drive regeneration from the
# excluded `extern/` submodules, so they are dead weight in a published package.
exclude = ["extern/**", "xtask/**", ".gitmodules", "scripts/generate.ps1"]

[package.metadata.docs.rs]
all-features = true

[workspace]
members = ["xtask"]
resolver = "3"

[dependencies]
hiera = "0.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
log = "0.4"
thiserror = "2"
url = "2"
typed-path = "0.12"

[dev-dependencies]
futures = "0.3"
